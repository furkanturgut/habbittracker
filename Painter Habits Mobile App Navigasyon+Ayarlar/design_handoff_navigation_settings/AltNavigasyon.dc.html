<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
</helmet>
<div style="position:relative;width:100%;height:90px;box-sizing:border-box;padding:10px 12px 26px;display:flex;align-items:stretch;gap:2px;background:linear-gradient(180deg,#3e2a1c 0%,#2b1b12 100%);border-top:2px solid rgba(226,176,74,.28);box-shadow:0 -8px 18px rgba(0,0,0,.28);font-family:'Fredoka',sans-serif">
<div onClick="{{ t0.pick }}" style="position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:{{ t0.fg }}">
<div style="position:absolute;top:-16px;left:50%;margin-left:-4px;width:8px;height:8px;border-radius:2px;transform:rotate(45deg);background:#e2b04a;opacity:{{ t0.ind }};transition:opacity .2s"></div>
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="10" rx="1"></rect><path d="M12 2v2M8 14l-2.5 7M16 14l2.5 7M12 14v4"></path></svg>
<span style="font:{{ t0.w }} 11px 'Fredoka'">Atölye</span>
</div>
<div onClick="{{ t1.pick }}" style="position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:{{ t1.fg }}">
<div style="position:absolute;top:-16px;left:50%;margin-left:-4px;width:8px;height:8px;border-radius:2px;transform:rotate(45deg);background:#e2b04a;opacity:{{ t1.ind }};transition:opacity .2s"></div>
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5l1.5 1.5L8.5 5M11.5 7h8.5M4 12.5l1.5 1.5 3-3M11.5 13h8.5M11.5 19h8.5"></path><rect x="4" y="17" width="4" height="4" rx="1"></rect></svg>
<span style="font:{{ t1.w }} 11px 'Fredoka'">Alışkanlıklar</span>
</div>
<div onClick="{{ t2.pick }}" style="position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:{{ t2.fg }}">
<div style="position:absolute;top:-16px;left:50%;margin-left:-4px;width:8px;height:8px;border-radius:2px;transform:rotate(45deg);background:#e2b04a;opacity:{{ t2.ind }};transition:opacity .2s"></div>
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1"></rect><rect x="6.5" y="7.5" width="11" height="9"></rect><path d="M7 16l3.5-4 2.5 3 1.5-1.5L17 16"></path></svg>
<span style="font:{{ t2.w }} 11px 'Fredoka'">Galeri</span>
</div>
<div style="width:1px;margin:6px 6px 2px;background:rgba(243,230,204,.12)"></div>
<div onClick="{{ moodPress }}" style="width:62px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer">
<div style="width:36px;height:36px;border-radius:50%;background:#e2b04a;padding:2px;box-sizing:border-box;box-shadow:0 3px 0 rgba(0,0,0,.35)">
<div style="width:100%;height:100%;border-radius:50%;background:#7a1f22 {{ moodBg }} center/100% 100% no-repeat;image-rendering:pixelated"></div>
</div>
<span style="font:600 10px 'Fredoka';color:#e2b04a;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap">{{ moodLabel }}</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:366,&quot;height&quot;:90},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;0&quot;,&quot;1&quot;,&quot;2&quot;],&quot;default&quot;:&quot;0&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;mood&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:5,&quot;min&quot;:0,&quot;max&quot;:12,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;onTab&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(index: number) =&gt; void&quot;},&quot;onMood&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  MOODS = [[11, 'UltraRich', 'Çok zengin'], [9, 'Rich', 'Zengin'], [7, 'Happy', 'Mutlu'], [4, 'Normal', 'Normal'], [2, 'Sad', 'Üzgün'], [0, 'Starve', 'Aç']];
  renderVals() {
    const a = Number(this.props.active ?? 0), m = Number(this.props.mood ?? 5);
    const [, key, label] = this.MOODS.find(x => m >= x[0]) || this.MOODS[5];
    const tab = i => ({ fg: i === a ? '#e2b04a' : 'rgba(243,230,204,.62)', w: i === a ? 600 : 500, ind: i === a ? 1 : 0, pick: () => this.props.onTab && this.props.onTab(i) });
    return { t0: tab(0), t1: tab(1), t2: tab(2), moodBg: 'url(sprites/mood/Mood_' + key + '.png)', moodLabel: label, moodPress: () => this.props.onMood && this.props.onMood() };
  }
}
</script>
</body>
</html>
