name: iOS Build & TestFlight

on:
  workflow_dispatch:

env:
  BUNDLE_ID: com.fturgut.habbittracker
  APP_NAME: HabbitTracker

jobs:
  unity-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-iOS-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          buildName: ${{ env.APP_NAME }}
      - uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-project
          path: build/iOS

  ios-testflight:
    needs: unity-build
    runs-on: macos-26
    steps:
      - name: Xcode sürümünü doğrula
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - uses: actions/download-artifact@v4
        with:
          name: ios-xcode-project
          path: build/iOS

      - name: Sertifika ve profili keychain'e kur
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          echo "$PROFILE_BASE64" | base64 --decode > $RUNNER_TEMP/profile.mobileprovision

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN
          security set-keychain-settings -lut 21600 $KEYCHAIN
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN
          security import $RUNNER_TEMP/cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN
          security list-keychain -d user -s $KEYCHAIN login.keychain-db

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i $RUNNER_TEMP/profile.mobileprovision > $RUNNER_TEMP/profile.plist
          UUID=$(plutil -extract UUID raw $RUNNER_TEMP/profile.plist)
          PROFILE_NAME=$(plutil -extract Name raw $RUNNER_TEMP/profile.plist)
          cp $RUNNER_TEMP/profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV

      - name: Xcode projesini imzalı archive et
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          XCPROJ=$(find build/iOS -maxdepth 3 -name "*.xcodeproj" | head -1)
          echo "Bulunan proje: $XCPROJ"
          if [ -z "$XCPROJ" ]; then
            echo "HATA: .xcodeproj bulunamadı"
            find build -maxdepth 4
            exit 1
          fi
          PROJ_DIR=$(dirname "$XCPROJ")
          SCHEME=$(basename "$XCPROJ" .xcodeproj)
          cd "$PROJ_DIR"
          xcodebuild -list -project "$SCHEME.xcodeproj"
          xcodebuild \
            -project "$SCHEME.xcodeproj" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      - name: IPA olarak export et
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: TestFlight'a yükle
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun altool --upload-app -t ios \
            -f "$RUNNER_TEMP"/export/*.ipa \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Yedek olarak .ipa'yı artifact yap
        uses: actions/upload-artifact@v4
        with:
          name: habbittracker-ipa
          path: ${{ runner.temp }}/export/*.ipa